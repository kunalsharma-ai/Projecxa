name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: mongodb://127.0.0.1:27017/projexa_test?replicaSet=rs0
      DATABASE_URL: mongodb://127.0.0.1:27017/projexa_test?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # MongoDB 8.0 as a one-member replica set (Prisma needs one for transactions), run from
      # the official tarball instead of a Docker Hub image, and the MongoDB Database Tools
      # (mongodump/mongorestore) for the backup tests. Every wait is bounded so a broken
      # start fails in minutes with the server log instead of hanging the job.
      - name: Install MongoDB, mongosh and Database Tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.4.tgz | tar xz -C /tmp
          curl -fsSL --retry 3 https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.13.0.tgz | tar xz -C /tmp
          npm install -g mongosh@2.14.1
          echo "/tmp/mongodb-linux-x86_64-ubuntu2404-8.0.4/bin" >> "$GITHUB_PATH"
          echo "/tmp/mongodb-database-tools-ubuntu2404-x86_64-100.13.0/bin" >> "$GITHUB_PATH"
      - name: Start MongoDB replica set
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p /tmp/mongo-data
          mongod --version
          mongod --replSet rs0 --bind_ip 127.0.0.1 --port 27017 --dbpath /tmp/mongo-data \
            --fork --logpath /tmp/mongod.log
          ready=
          for i in $(seq 1 30); do
            if mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          [ -n "$ready" ] || { echo "mongod did not accept connections"; exit 1; }
          mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
          for i in $(seq 1 60); do
            if mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              echo "replica set rs0 is primary"; mongodump --version; exit 0
            fi
            sleep 1
          done
          echo "replica set never became primary"
          mongosh --quiet --eval "printjson(rs.status())" || true
          exit 1
      - name: MongoDB log
        if: failure()
        run: tail -n 200 /tmp/mongod.log || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @projexa/api prisma:generate
      - run: pnpm --filter @projexa/api typecheck
      - run: pnpm --filter @projexa/api test
        timeout-minutes: 15
      - run: pnpm --filter @projexa/web typecheck
      - run: pnpm --filter @projexa/web test
      - run: pnpm --filter @projexa/web build
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
