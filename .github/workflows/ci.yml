name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: mongodb://127.0.0.1:27017/projexa_test?replicaSet=rs0
      DATABASE_URL: mongodb://127.0.0.1:27017/projexa_test?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # MongoDB as a one-member replica set (Prisma needs one for transactions), and the
      # MongoDB Database Tools for the backup tests.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }" && break; sleep 2; done
          until docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 1; done
      - name: Install MongoDB Database Tools
        run: |
          curl -sSL https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.13.0.tgz | tar xz -C /tmp
          echo "/tmp/mongodb-database-tools-ubuntu2404-x86_64-100.13.0/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @projexa/api prisma:generate
      - run: pnpm --filter @projexa/api typecheck
      - run: pnpm --filter @projexa/api test
      - run: pnpm --filter @projexa/web typecheck
      - run: pnpm --filter @projexa/web test
      - run: pnpm --filter @projexa/web build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
