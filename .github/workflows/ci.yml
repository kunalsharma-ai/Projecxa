name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projexa
          POSTGRES_PASSWORD: projexa
          POSTGRES_DB: projexa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U projexa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://projexa:projexa@localhost:5432/projexa_test
      DATABASE_URL: postgresql://projexa:projexa@localhost:5432/projexa_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @projexa/api prisma:generate
      - run: pnpm --filter @projexa/api typecheck
      - run: pnpm --filter @projexa/api test
      - run: pnpm --filter @projexa/web typecheck
      - run: pnpm --filter @projexa/web test
      - run: pnpm --filter @projexa/web build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
