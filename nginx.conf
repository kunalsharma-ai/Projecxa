worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Allow up to 100MB uploads for CSV respondent imports and file attachments
    client_max_body_size 100M;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream definition for PROJEXA API (Backend)
    upstream backend_upstream {
        server backend:4000;
        keepalive 32;
    }

    # Upstream definition for PROJEXA Web (Frontend)
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # Common proxy headers configuration
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 1. Dedicated API Virtual Host (e.g. api.yourcompany.com or api.*)
    server {
        listen 80;
        server_name ~^api\..+$;

        location / {
            proxy_pass http://backend_upstream;
        }
    }

    # 2. Default Gateway Server (Single domain or app.yourcompany.com)
    server {
        listen 80 default_server;
        server_name _;

        # API endpoints
        location /api/ {
            proxy_pass http://backend_upstream;
        }

        # Excluded root-level API routes (defined in apps/api/src/bootstrap.ts):
        # /s/  -> Survey entry redirects
        # /u/  -> Unique one-time respondent links
        # /r/  -> Redirect status destinations
        # /end/-> Terminal respondent completion/screenout redirects
        # /g/  -> Gatekeeper bot/captcha protection
        # /pa/ -> Participant account access
        location ~ ^/(s|u|r|end|g|pa)/ {
            proxy_pass http://backend_upstream;
        }

        # Frontend Next.js Web App (Default fallback)
        location / {
            proxy_pass http://frontend_upstream;
        }
    }
}
